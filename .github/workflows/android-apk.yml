name: Build Signed Android APK

on:
  workflow_dispatch: # 允许在 GitHub 页面手动触发构建
  push:
    branches: [ main ] # 推送到 main 分支时自动触发

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 1. 配置前端环境 (Node.js & pnpm)
      # ============================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # 项目要求 pnpm 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 项目要求 Node.js 22
          cache: 'pnpm'

      # ============================================
      # 2. 配置 Rust 环境
      # ============================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90 # 项目要求 Rust 1.90 或更高

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      # ============================================
      # 3. 配置 Android 构建环境 (SDK & NDK)
      # ============================================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Tauri Android 构建通常需要 JDK 17

      # 升级到 v4，避开已下架的 tools 包；显式只装 platform-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      # 在安装 NDK 之前显式接受所有 SDK 许可证
      - name: Accept all Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Android SDK licenses accepted."

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c # 指定一个稳定的 NDK 版本
          add-to-path: true

      - name: Configure Environment Variables
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # ============================================
      # 4. 安装依赖并初始化 Tauri Android 工程
      # ============================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android Project
        run: pnpm tauri android init

      # ============================================
      # ★ 新增：运行时动态完成全部签名配置
      #   不依赖本地 gen/android 目录，全部在 CI 中生成
      # ============================================
      - name: Setup Android signing configuration
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$(pwd)/${ANDROID_DIR}/release.keystore"
          PROPERTIES_FILE="${ANDROID_DIR}/keystore.properties"
          BUILD_FILE="${ANDROID_DIR}/app/build.gradle.kts"
          SIGNING_FILE="${ANDROID_DIR}/android-signing.gradle.kts"
          SIGNING_ABS_PATH="$(pwd)/${SIGNING_FILE}"

          # 1) 解码 Base64 Keystore 到 Android 工程目录
          printf '%s' "$KEY_BASE64" | base64 -d > "$KEYSTORE_PATH"

          # 2) 生成 keystore.properties（storeFile 使用绝对路径，避免相对路径歧义）
          cat > "$PROPERTIES_FILE" <<EOF
          storeFile=${KEYSTORE_PATH}
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          # 3) 创建独立的签名 Gradle 脚本
          cat > "$SIGNING_FILE" <<'GRADLE_EOF'
          import java.io.FileInputStream
          import java.util.Properties

          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE_EOF

          # 4) 在生成的 app/build.gradle.kts 末尾 apply 签名脚本（使用绝对路径，最稳健）
          echo "" >> "$BUILD_FILE"
          echo "apply(from = \"${SIGNING_ABS_PATH}\")" >> "$BUILD_FILE"

          echo "===== Signing configuration ready ====="
          ls -la "$ANDROID_DIR"
          cat "$PROPERTIES_FILE"

      # ============================================
      # 5. 构建并上传已签名 APK
      # ============================================
      - name: Build Android APK
        run: pnpm android:build

      - name: List build outputs
        if: always()
        run: |
          echo "===== Searching for APK/AAB/IPA artifacts ====="
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" \) 2>/dev/null || echo "No matching artifacts found."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error # 若找不到 APK 则显式报错，便于排查
