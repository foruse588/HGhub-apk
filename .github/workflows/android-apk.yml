name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 1. 前端与 Rust 环境
      # ============================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      # ============================================
      # 2. Android SDK / NDK 环境
      # ============================================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Accept all Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure Environment Variables
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # ============================================
      # 3. 安装依赖并初始化 Tauri Android 工程
      # ============================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android Project
        run: pnpm tauri android init

      # ============================================
      # 4. 运行时动态完成签名配置（直接追加到 app/build.gradle.kts）
      # ============================================
      - name: Setup Android signing configuration
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$(pwd)/${ANDROID_DIR}/release.keystore"
          PROPERTIES_FILE="${ANDROID_DIR}/keystore.properties"
          BUILD_FILE="${ANDROID_DIR}/app/build.gradle.kts"

          # 1) 解码 Base64 Keystore
          printf '%s' "$KEY_BASE64" | base64 -d > "$KEYSTORE_PATH"

          # 2) 生成 keystore.properties（storeFile 使用绝对路径）
          cat > "$PROPERTIES_FILE" <<EOF
          storeFile=${KEYSTORE_PATH}
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          # 3) 直接把签名配置追加到 app/build.gradle.kts 末尾
          #    注意：不使用 import，全部用全限定名，避免 Kotlin 脚本语法错误
          cat >> "$BUILD_FILE" <<'GRADLE_EOF'

          // ===== Injected signing configuration (CI) =====
          val ciKeystorePropertiesFile = rootProject.file("keystore.properties")
          val ciKeystoreProperties = java.util.Properties()
          if (ciKeystorePropertiesFile.exists()) {
              java.io.FileInputStream(ciKeystorePropertiesFile).use { fis ->
                  ciKeystoreProperties.load(fis)
              }
          }

          android {
              signingConfigs {
                  create("release") {
                      storeFile = java.io.File(ciKeystoreProperties["storeFile"] as String)
                      storePassword = ciKeystoreProperties["storePassword"] as String
                      keyAlias = ciKeystoreProperties["keyAlias"] as String
                      keyPassword = ciKeystoreProperties["keyPassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE_EOF

          echo "===== Signing configuration injected ====="
          ls -la "$ANDROID_DIR"
          cat "$PROPERTIES_FILE"
          echo "----- tail of app/build.gradle.kts -----"
          tail -n 30 "$BUILD_FILE"

      # ============================================
      # 5. 构建并上传已签名 APK
      # ============================================
      - name: Build Android APK
        run: pnpm android:build

      - name: List build outputs
        if: always()
        run: |
          echo "===== Searching for APK/AAB/IPA artifacts ====="
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" \) 2>/dev/null || echo "No matching artifacts found."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
